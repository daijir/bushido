<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>武士道 - Bushido: The Soul of Japan</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="新渡戸稲造『武士道（Bushido: The Soul of Japan）』日英対訳ノート。英文原典と岩波文庫・矢内原忠雄訳の対訳。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-color: #2c5282;
      --heading-color: #1a365d;
      --text-color: #2d3748;
      --sidebar-nav-link-color: #4a5568;
      --sidebar-nav-link-color--active: #2c5282;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", Meiryo, sans-serif;
      font-size: 16px;
      line-height: 1.85;
      color: var(--text-color);
      background-color: #fafbfc;
    }

    .markdown-section {
      max-width: 860px;
      padding: 30px 40px;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: var(--heading-color);
      font-weight: 700;
    }

    .markdown-section h1 {
      font-size: 2rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
      margin-top: 1.5rem;
      margin-bottom: 1.8rem;
    }

    .markdown-section p {
      margin-bottom: 1.4rem;
      line-height: 1.9;
      font-weight: 600;
    }

    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background: #f7fafc;
      color: #4a5568;
      padding: 12px 20px;
      margin: 1.5em 0;
      border-radius: 0 6px 6px 0;
    }

    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5em 0;
    }

    .markdown-section table th,
    .markdown-section table td {
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
    }

    .markdown-section table th {
      background-color: #edf2f7;
      color: var(--heading-color);
    }

    .sidebar {
      background-color: #f7fafc;
      border-right: 1px solid #e2e8f0;
    }

    .sidebar-nav strong {
      color: var(--heading-color);
      font-size: 1.05rem;
    }

    .sidebar-nav li > a {
      font-size: 14px;
      padding: 6px 0;
      line-height: 1.4;
    }

    .app-name-link {
      font-weight: 700;
      color: var(--theme-color) !important;
      font-size: 1.2rem;
    }

    /* ページ送りプラグイン */
    .pagination-item {
      margin-top: 2.5rem;
    }
    .pagination-item-title {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">読込中... / Loading...</div>
  <script>
    window.$docsify = {
      name: '武士道 Bushido',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '検索 / Search...',
        noData: '見つかりませんでした / No Results',
        depth: 6
      },
      pagination: {
        previousText: '前の章',
        nextText: '次の章',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'コピー',
        errorText: 'エラー',
        successText: 'コピー完了'
      }
    };
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Pagination Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
